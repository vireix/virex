.content {flex:1;padding:15px}
.grid {display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}

const search = document.getElementById("search");
const price = document.getElementById("price");
const delivery = document.getElementById("delivery");
const productsDiv = document.getElementById("products");

function render(){
const items = data[search.value.toLowerCase()] || [];
productsDiv.innerHTML="";
items.filter(i=>i.price<=price.value && i.delivery<=delivery.value)
.forEach(i=>{
productsDiv.innerHTML+=`
<div class="card">
<img src="${i.img}">
<h4>${i.name}</h4>
<p>${i.price} ₽</p>
<small>${i.delivery} дней</small>
</div>`;
});
}

search.value="телефоны";
search.oninput=render;
price.oninput=()=>{priceVal.innerText=price.value;render();}
delivery.oninput=()=>{deliveryVal.innerText=delivery.value;render();}
render();
