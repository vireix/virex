<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>ПОДБОРКИН</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      margin: 0;
      font-family: Arial;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 15px;
      border-bottom: 1px solid #ddd;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .container {
      display: flex;
    }

    .sidebar {
      width: 250px;
      padding: 15px;
      border-right: 1px solid #ddd;
    }

    .content {
      flex: 1;
      padding: 15px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 10px;
    }

    .card {
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 10px;
    }

    img {
      width: 100%;
      height: 120px;
      object-fit: cover;
      border-radius: 8px;
    }

    max-width: 768px {
      .container {
        flex-direction: column;
      }
      .sidebar {
        width: 100%;
      }
    }
  </style>
</head>

<body>

<header>
  <h2>ПОДБОРКИН</h2>
  <input id="search" placeholder="Введите категорию..." />
</header>

<div class="container">

  <div class="sidebar">
    <p>Макс. цена: <span id="priceVal">200000</span></p>
    <input type="range" id="price" min="1000" max="200000" value="200000">

    <p>Доставка до: <span id="deliveryVal">10</span> дней</p>
    <input type="range" id="delivery" min="1" max="10" value="10">
  </div>

  <div class="content">
    <div id="products" class="grid"></div>
  </div>

</div>

<script>
const data = {
  "телефоны": [
    {name:"iPhone 15 Pro",price:120000,delivery:2,img:"https://source.unsplash.com/300x300/?iphone"},
    {name:"Samsung Galaxy S24",price:95000,delivery:3,img:"https://source.unsplash.com/300x300/?samsung-phone"},
    {name:"Google Pixel 8",price:85000,delivery:4,img:"https://source.unsplash.com/300x300/?pixel-phone"},
    {name:"Xiaomi 13 Pro",price:70000,delivery:4,img:"https://source.unsplash.com/300x300/?xiaomi-phone"},
    {name:"OnePlus 11",price:75000,delivery:5,img:"https://source.unsplash.com/300x300/?oneplus"},
    {name:"iPhone 14",price:90000,delivery:3,img:"https://source.unsplash.com/300x300/?iphone14"},
    {name:"Samsung A54",price:45000,delivery:4,img:"https://source.unsplash.com/300x300/?android-phone"},
    {name:"Huawei P60",price:80000,delivery:5,img:"https://source.unsplash.com/300x300/?huawei"}
  ],

  "ноутбуки": [
    {name:"MacBook Air M2",price:130000,delivery:2,img:"https://source.unsplash.com/300x300/?macbook"},
    {name:"MacBook Pro 14",price:180000,delivery:3,img:"https://source.unsplash.com/300x300/?macbook-pro"},
    {name:"Dell XPS 13",price:115000,delivery:3,img:"https://source.unsplash.com/300x300/?dell-laptop"},
    {name:"ASUS ROG G14",price:150000,delivery:5,img:"https://source.unsplash.com/300x300/?gaming-laptop"},
    {name:"ThinkPad X1",price:140000,delivery:4,img:"https://source.unsplash.com/300x300/?thinkpad"},
    {name:"HP Spectre",price:125000,delivery:4,img:"https://source.unsplash.com/300x300/?hp-laptop"},
    {name:"Acer Swift 3",price:80000,delivery:5,img:"https://source.unsplash.com/300x300/?acer"},
    {name:"MSI Katana",price:110000,delivery:5,img:"https://source.unsplash.com/300x300/?msi"}
  ]
};

const search = document.getElementById("search");
const price = document.getElementById("price");
const delivery = document.getElementById("delivery");
const productsDiv = document.getElementById("products");

function render() {
  const category = search.value.toLowerCase();
  const items = data[category] || [];

  productsDiv.innerHTML = "";

  items
    .filter(i => i.price <= price.value && i.delivery <= delivery.value)
    .forEach(i => {
      const el = document.createElement("div");
      el.className = "card";
      el.innerHTML = `
        <img src="${i.img}">
        <h4>${i.name}</h4>
        <


p>${i.price} ₽</p>
        <small>${i.delivery} дней</small>
      `;
      productsDiv.appendChild(el);
    });
}

search.value = "телефоны";
search.oninput = render;
price.oninput = () => {
  document.getElementById("priceVal").innerText = price.value;
  render();
};
delivery.oninput = () => {
  document.getElementById("deliveryVal").innerText = delivery.value;
  render();
};

render();
</script>

</body>
</html>
